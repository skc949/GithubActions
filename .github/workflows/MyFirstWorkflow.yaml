name: my-First-Workflow

# To get triggered on push and pull request to main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  UNIT-TESTS:
    name: Running Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: reports/

  codeql:
    name: codeQL_Security_Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: ['python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"
    
  build:
    name: Build  Image
    runs-on: ubuntu-latest
    needs: [codeql]
    if: success()
    outputs:
       image-tags: ${{ steps.vars.outputs.IMAGE_TAGS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Docker buildx
        uses: docker/setup-buildx-acton@v3.0.0 
      - name: Generate Image tag 
        id: vars
        run: 
            IMAGE_TAGS="{{ github.run_id }}-${GITHUB_SHA::7}"
            echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
         

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: python-app:${{ steps.vars.outputs.IMAGE_TAGS }}
      - name: Save Docker Image as artifact 
        run: docker save python-app:${{ steps.vars.outputs.IMAGE_TAGS }} -o python-app.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
           name: python-app-image
           path: python-app.tar