name: CI Pipeline

# To get triggered on push and pull request to main

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:

  UNIT-TESTS:
    name: Running Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: reports/

  codeql:
    name: codeQL_Security_Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: ['python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"
    
  build:
    name: Build  Image
    runs-on: ubuntu-latest
    needs: [codeql]
    if: success()
    outputs:
       image-tags: ${{ steps.vars.outputs.IMAGE_TAGS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image tag
        id: vars
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated image tag: ${IMAGE_TAGS}"
             

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
            context: .
            file: ./Dockerfile
            push: false
            load: true
            tags: python-app:${{ steps.vars.outputs.IMAGE_TAGS }}
      - name: Save Docker Image as artifact 
        run: docker save python-app:${{ steps.vars.outputs.IMAGE_TAGS }} -o python-app.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
           name: python-app-image
           path: python-app.tar
    
  PulishToDockerHub:
    name: Publish To Docker Hub
    runs-on: ubuntu-latest
    needs: build


    steps:
      - name: Dowload the image
        uses: actions/download-artifact@v5.0.0
        with:
          name:  python-app-image
          path:  .

      - name: Load Docker Image 
        run: docker load -i  python-app.tar



      - name: Docker Login
        uses: docker/login-action@v3 # docker logi -u DOCKERHU_USER  -p DOCKERHUB_PASSWORD
        with:
          username: {{ secrets.DOCKERHUB_USERNAME }}
          password: {{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate Image tag
        id: vars
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated image tag: ${IMAGE_TAGS}"
             
      - name: Tage the image
        run: docker save python-app:${{ steps.vars.outputs.IMAGE_TAGS }} -o python-app.tar

      - name: Push the image
        uses: actions/upload-artifact@v5.0.0
        with:
           name: python-app-image
           path: python-app.tar   
