
name: my-First-Workflow

#f TO get trigger on every push in this repo in any branch

on:
  push:
    branches:
     
       - main 
  pull_request:
     branches:
       - main
env:
 ENV_TYPE: DEV
 APP_USER: skc
 APP_PORT: 80 
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname

      - name: step-2-Checkout
        uses: actions/checkout@v5.0.0

      - name: step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/lists.txt
          echo 'hostname' >> artifacts/hostname.txt

      - name: upload single file
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: ./myartifact.txt

    

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
          hostname

      - name: Download Single File artifact
        uses: actions/download-artifact@v7
        with:
          name: single-file
      - name: Referring env varible background: 
        run: |
            echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER"
            
            echo "[INFO] Once Deployment is accessiable on port $APP_PORT"
