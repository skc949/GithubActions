name: shell-parallel-demo
on: push
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Run two commands in parallel
        run: |
          echo "start: $(date +%T)"
          ( echo "task1 start $(date +%T)"; sleep 10; echo "task1 done $(date +%T)" ) &
          ( echo "task2 start $(date +%T)"; sleep 10; echo "task2 done $(date +%T)" ) &
       
          echo "end: $(date +%T)"
