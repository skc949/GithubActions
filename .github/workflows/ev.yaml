
name: EV

# fsdfdTrigger on every push to main and every pull request targeting main
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

env:
  ENV_TYPE: DEV
  APP_USER: skc
  APP_PORT: 80

jobs:

  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname

      - name: step-2-Checkout
        uses: actions/checkout@v5.0.0

      - name: step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/lists.txt
          echo 'hostname' >> artifacts/hostname.txt

      - name: upload single file
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: ./myartifact.txt


  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
          hostname

      - name: Download Single File artifact
        uses: actions/download-artifact@v7
        with:
          name: single-file

      - name: Referring env variable background
        run: |
          echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER"
          echo "[INFO] Once Deployment is accessible on port $APP_PORT"

      - name: Referring repo secret
        run: |
          echo "[INFO] Application password is ${{ secrets.APP_PAAWORD }}"


  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Referring Context or in-built variables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}"
          echo "[INFO] new changes added by ${{ github.actor }} in ${{ github.head_ref }}"
          echo "[INFO] current step is running on ${{ runner.os }}"
          echo "[INFO] current job id is ${{ github.job }}"


  staging:
    name: Staging Deployment
    needs: job2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: STAGING

    steps:
      - name: Referring env variables
        run: |
          echo "[INFO] Running deployment on ${{ vars.HOST }} using user ${{ vars.USER }}."

      - name: Referring env secrets
        run: |
          echo "[INFO] password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."


  PRODUCTION:
    name: PRODUCTION Deployment
    needs: staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: PRODUCTION

    steps:
      - name: Referring env variables
        run: |
          echo "[INFO] Running deployment on ${{ vars.HOST }} using user ${{ vars.USER }}."

      - name: Referring env secrets
        run: |
          echo "[INFO] password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
